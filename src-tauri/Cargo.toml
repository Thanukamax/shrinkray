[package]
name = "shrinkray-tauri"
version.workspace = true
description = "Cut Unreal Engine game folder size by trimming what you don't need"
authors.workspace = true
license-file.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "shrinkray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "shrinkray-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
# v0.7.0: pull in shrinkray-core's `inference` feature so the AI-restore
# Tauri command can probe ONNX models. ORT adds ~200 MB to the build but
# it's only loaded when the user actually clicks "Restore (AI)".
shrinkray-core = { workspace = true, features = ["inference"] }
shrinkray-audit.workspace = true
shrinkray-sidecar.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
dirs = "5"
base64 = "0.22"

[dev-dependencies]
tempfile.workspace = true
