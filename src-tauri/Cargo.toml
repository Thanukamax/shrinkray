[package]
name = "shrinkray"
version = "0.3.0"
description = "Cut Unreal Engine game folder size by trimming what you don't need"
authors = ["Thanukamax"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "shrinkray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "shrinkray"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
anyhow = "1"
thiserror = "2"
# UE pak read — pinned to git v0.2.3, crates.io is stuck at 0.1.0.
# See research/A_pak_iostore.md for why we need 0.2.x.
repak = { git = "https://github.com/trumank/repak", rev = "e215472c51db69328b1ce77be2db24d24c1d646b" }
sha2 = "0.10"  # SHA256 of backup payloads + post-restore verification

# Later-step deps (uncomment when implementation lands):
# image         = "0.25"  # texture decode (PNG/TGA/DDS) — Step 4
# image_dds     = "0.7"   # BCn decode — Step 4
# intel_tex_2   = "0.5"   # BC1/3/7 encode (ISPC-backed) — Step 4
# symphonia     = { version = "0.5", features = ["all"] }  # audio decode — Step 4
# opus          = "0.3"   # audio re-encode — Step 4
# image-compare = "0.5"   # SSIM (Phase 1.5)
# rayon         = "1"     # parallel asset processing

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
