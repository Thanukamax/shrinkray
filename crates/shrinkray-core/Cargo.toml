[package]
name = "shrinkray-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
description = "Core logic for shrinkray: analyze, backup, pak ops, L10N strip, loose-file recompression"

[dependencies]
serde.workspace = true
serde_json.workspace = true
walkdir.workspace = true
anyhow.workspace = true
thiserror.workspace = true
sha2.workspace = true
repak.workspace = true
# v0.7.4: standalone delta-codec crate. Always-on (no heavy transitive deps)
# so `predictors::EsrganX4Predictor` can `impl shrinkray_delta_codec::Predictor`
# without making the codec depend on `ort`. Codec stays publishable alone.
shrinkray-delta-codec.workspace = true
# v0.7.0: ORT + ndarray drive the inference module. Both behind a `inference`
# feature so the core crate builds without them on slim configs (CI of the
# audit/strip subsystem doesn't need a 200 MB ORT binary).
ort = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
image = { workspace = true, optional = true }
image_dds = { workspace = true, optional = true }

[features]
default = []
# AI re-expand path. Adds ~200 MB to the build artifact via ORT's prebuilt
# libs. Off by default so the lean audit/strip-only workflow stays fast.
inference = ["dep:ort", "dep:ndarray", "dep:image", "dep:image_dds"]

[dev-dependencies]
tempfile.workspace = true
# Bench/corpus harness deps (used only by the paper-bench examples below).
# image gets webp turned on locally so the corpus walker can ingest PBR
# downloads regardless of source format.
clap = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rayon = "1.10"
zstd = "0.13"
# walkdir + shrinkray-delta-codec live in [dependencies] already (workspace
# pulled the delta-codec into core in the v0.7.4 reshuffle), no need to dup
# them here.

[[example]]
name = "bench_real_content"
path = "examples/bench_real_content.rs"

[[example]]
name = "gen_synthetic_corpus"
path = "examples/gen_synthetic_corpus.rs"

# v0.7.4: ESRGAN-x4 predictor smoke check. Requires the `inference` feature
# (ORT pulls a ~200 MB native lib). Skips at runtime if the ONNX model isn't
# on disk, so it's safe to invoke in slim CI lanes.
[[example]]
name = "esrgan_smoke"
path = "examples/esrgan_smoke.rs"
required-features = ["inference"]

# Router gate (warmcore Phase-1): measures codec-vs-backup routing headroom +
# cheap-feature separability before any router is trained. Needs `image` (via
# the inference feature). Bilinear-only — does not load the ONNX model.
[[example]]
name = "router_gate"
path = "examples/router_gate.rs"
required-features = ["inference"]

# BCn gate: residual measured against the on-disk BCn byte count (not RGBA) —
# the honest cooked-texture file-size delta vs ExactBackup.
[[example]]
name = "bcn_gate"
path = "examples/bcn_gate.rs"
required-features = ["inference"]

# Cross-asset dedup prize sizer: exact dups, near-dups (perceptual hash), and
# intra-material cross-map redundancy (zstd joint vs independent). Model-free,
# no ORT — uses the dev-dep image + zstd directly.
[[example]]
name = "crossasset_gate"
path = "examples/crossasset_gate.rs"
