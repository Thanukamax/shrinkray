name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: cargo test + frontend build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libxdo-dev \
            opus-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: oven-sh/setup-bun@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: bun install

      - name: Cargo clippy (warnings allowed for now)
        working-directory: src-tauri
        run: cargo clippy --lib --tests --no-deps
        continue-on-error: true

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --lib

      - name: Frontend type check + build
        run: bun run build

  # Lyra smoke test — disabled.
  #
  # Lyra Starter Game cooked PC build is 5-15 GB and needs Epic-auth to
  # download Lyra source, plus a full Unreal Engine install to cook a binary
  # we can hand shrinkray. Neither fits the free GitHub-hosted runners.
  #
  # When a self-hosted runner exists with a pre-cooked Lyra binary at
  # /srv/shrinkray-corpus/Lyra/, flip this job's `if:` to a meaningful
  # trigger. Until then, Lyra validation is a manual pre-release step —
  # see scripts/lyra-smoke.sh for the procedure.
  lyra-smoke:
    name: Lyra cooked-build smoke test (deferred — see comment)
    if: false
    runs-on: self-hosted
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build shrinkray release
        run: bun run tauri build
      - name: Optimise a Lyra corpus copy
        run: scripts/lyra-smoke.sh /srv/shrinkray-corpus/Lyra
      - name: Boot Lyra and watch for crash (30 s)
        run: |
          timeout 30s /tmp/lyra-test/Lyra/Binaries/Linux/Lyra-Linux-Shipping || \
            test $? -eq 124  # exit 124 from timeout = clean (no crash)
