[workspace]
resolver = "2"
members = [
    "crates/shrinkray-core",
    "crates/shrinkray-audit",
    "crates/shrinkray-cli",
    "crates/shrinkray-sidecar",
    "src-tauri",
]
# external/repak is a vendored submodule with its own workspace — don't
# let cargo absorb its members (repak_cli, oodle_loader) into ours. The
# patch override below pulls in just the `repak` crate via cargo's
# dependency graph.
exclude = ["external/repak"]

[workspace.package]
version = "0.7.2"
edition = "2021"
rust-version = "1.77"
license-file = "LICENSE"
authors = ["Thanukamax"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
# UE pak read — pinned to git v0.2.3, crates.io is stuck at 0.1.0.
# See research/A_pak_iostore.md for why we need 0.2.x.
repak = { git = "https://github.com/trumank/repak", rev = "e215472c51db69328b1ce77be2db24d24c1d646b" }
# v0.7.0: ONNX Runtime bindings for the AI re-expand path. `download-binaries`
# pulls a prebuilt ORT shared lib at build time so users don't need a system
# install. Pin to a 2.x release once one of the rc/beta tags settles — for
# now we track latest stable on crates.io.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries", "ndarray"] }
ndarray = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# v0.7.1: BCn en/decode for the AI restore round-trip (.ubulk mip ↔ RGBA).
# image_dds handles both directions; intel_tex_2 is the ISPC-accelerated
# encoder for BC1/3/5/7 — we use image_dds for the v0.7.1 cut and add
# intel_tex_2 later once we have a perf complaint.
image_dds = "0.7"

shrinkray-core = { path = "crates/shrinkray-core" }
shrinkray-audit = { path = "crates/shrinkray-audit" }
shrinkray-sidecar = { path = "crates/shrinkray-sidecar" }

# v0.6.2: redirect repak to a locally-patched fork (submodule at external/repak)
# that bumps zlib/gzip from `Compression::fast()` (level 1) → `Compression::best()`
# (level 9). Upstream's level-1 bloats Pamali-class rewrites ~13% past the
# original UE-cooked pak size; level-9 lands at size parity. See
# external/repak/repak/src/data.rs (shrinkray-patch comment).
[patch."https://github.com/trumank/repak"]
repak = { path = "external/repak/repak" }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
